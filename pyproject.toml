[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-spectrum-minimax-h3"
description = "A ComfyUI custom node implementing Spectrum spectral feature forecasting for native MiniMax H3 audio-video generation."
version = "0.2.19"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "xmarre" }]
keywords = ["comfyui", "minimax-h3", "spectrum", "diffusion", "video", "audio"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Repository = "https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3"
Documentation = "https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3/wiki"
"Bug Tracker" = "https://github.com/xmarre/ComfyUI-Spectrum-MiniMax-H3/issues"

[tool.comfy]
PublisherId = "xmarre"
DisplayName = "ComfyUI-Spectrum-MiniMax-H3"
Icon = ""
includes = []

[tool.setuptools.packages.find]
include = ["comfyui_spectrum_h3*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
