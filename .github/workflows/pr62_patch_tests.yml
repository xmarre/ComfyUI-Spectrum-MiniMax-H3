name: PR62 patch focused tests

on:
  push:
    branches:
      - fix-er-sde-prefix-bootstrap-confetti
    paths:
      - .github/pr62_patch_tests.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch stale ER-SDE assertions
        run: python .github/pr62_patch_tests.py
      - name: Commit patch
        run: |
          if git diff --quiet -- tests/test_er_sde_stochastic_compensation.py; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test_er_sde_stochastic_compensation.py
          git commit -m 'Align ER-SDE replay tests with solver-space prefix fix'
          git push origin HEAD:fix-er-sde-prefix-bootstrap-confetti
