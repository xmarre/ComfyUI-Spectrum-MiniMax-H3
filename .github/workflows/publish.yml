name: Publish to Comfy registry

# Explicit retry of an existing release; normal publication runs after tested-main CI.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Published release tag to republish (for example v0.2.30)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish-node:
    name: Republish selected tested release to Comfy registry
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'xmarre' }}
    steps:
      - name: Check out requested release tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag }}

      - name: Verify published release and matching checkout
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable semver release tag, got: ${TAG}" >&2
            exit 1
          fi
          if [[ "$(gh release view "${TAG}" --json isDraft --jq '.isDraft')" != "false" ]]; then
            echo "Refusing to republish an unpublished or draft release." >&2
            exit 1
          fi
          git fetch --no-tags --depth=1 origin "refs/tags/${TAG}:refs/tags/${TAG}"
          tag_commit="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          if [[ "$(git rev-parse HEAD)" != "${tag_commit}" ]]; then
            echo "Checked out revision does not match the selected release tag." >&2
            exit 1
          fi
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ "${TAG}" != "v${version}" ]]; then
            echo "Release tag and pyproject.toml version disagree." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install registry publisher without publication credentials
        shell: bash
        run: python -m pip install comfy-cli

      - name: Publish selected release to Comfy registry
        env:
          REGISTRY_ACCESS_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
          TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          if [[ -z "${REGISTRY_ACCESS_TOKEN}" ]]; then
            echo "REGISTRY_ACCESS_TOKEN is not configured." >&2
            exit 1
          fi
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "refs/tags/${TAG}^{commit}")" ]]; then
            echo "Release checkout changed after verification." >&2
            exit 1
          fi
          comfy --skip-prompt --no-enable-telemetry env
          comfy node publish --token "${REGISTRY_ACCESS_TOKEN}"
