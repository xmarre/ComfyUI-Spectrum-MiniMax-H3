name: BSA diagnostic mirror validation

on:
  push:
    branches:
      - mirror/core-bsa-pool-transition-20260910

permissions:
  contents: read

jobs:
  reviewed-core-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic mirror
        uses: actions/checkout@v4

      - name: Check out reviewed ComfyUI source
        uses: actions/checkout@v4
        with:
          repository: comfyanonymous/ComfyUI
          ref: be92396834f9b6e3e361cfe30e7eed693137a448
          path: ComfyUI

      - name: Check out reviewed RefDelta interop
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-MiniMax-H3-RefDelta-Solver
          ref: 21d0191d933fedf2885df082d33eb1bc2fffd529
          path: RefDeltaSolver

      - name: Check out reviewed Untwist interop
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-Untwisting-RoPE
          ref: 63c8d8df5e08dfdad4b397480d966b90f9b5a6c6
          path: UntwistRoPE

      - name: Check out reviewed Flow interop
        uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: 860f308cc4f84f920d0c1facd4ece028584a02a0
          path: FlowRegenerate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install reviewed test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            pytest ruff numpy scipy torchsde psutil safetensors einops tqdm pyyaml pillow packaging \
            transformers tokenizers sentencepiece aiohttp yarl alembic SQLAlchemy filelock \
            "av>=17.0.0" requests simpleeval blake3 kornia spandrel pydantic pydantic-settings \
            PyOpenGL comfy-angle "comfy-kitchen==0.2.33" "comfy-aimdo==0.5.3"
          python -m pip wheel --no-deps --wheel-dir /tmp/spectrum-h3-wheel .

      - name: Static checks
        id: static
        continue-on-error: true
        run: |
          python -m ruff check \
            comfyui_spectrum_h3/bsa_transition_probe.py \
            tests/test_bsa_transition_probe.py \
            tests/test_scheduler_bootstrap_entitlement.py \
            --ignore I001 \
            --output-format json > ruff.json
          python -m compileall -q comfyui_spectrum_h3 tests tools

      - name: Upload static report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bsa-diagnostic-static-report
          path: ruff.json

      - name: Run bounded diagnostic and scheduler tests
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI:${{ github.workspace }}/RefDeltaSolver:${{ github.workspace }}/UntwistRoPE:${{ github.workspace }}/FlowRegenerate
          SPECTRUM_REQUIRE_REVIEWED_BSA_FIXTURE: "1"
        run: |
          python -m pytest -q \
            tests/test_bsa_transition_probe.py \
            tests/test_scheduler_bootstrap_entitlement.py \
            tests/test_backend_history.py \
            tests/test_core_bsa_compat.py \
            tests/test_core_bsa_flow_compat.py \
            tests/test_core_bsa_flow_identity.py \
            tests/test_core_bsa_preprocess_compat.py \
            tests/test_core_bsa_source_hardening.py \
            tests/test_reviewed_bsa_fixture_gate.py \
            tests/test_runtime.py \
            tests/test_sampling.py \
            tests/test_continuum_interop.py \
            tests/test_sa_solver_state_conditioning.py

      - name: Enforce static checks
        if: steps.static.outcome == 'failure'
        run: exit 1
