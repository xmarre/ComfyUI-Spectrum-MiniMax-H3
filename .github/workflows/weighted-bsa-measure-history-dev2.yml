name: Weighted BSA measure history retry

on:
  push:
    branches:
      - mirror/mixed-grid-measure-implementation-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/mixed-grid-measure-implementation-20260910

      - name: Apply development patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tools/apply_core_bsa_measure_history.py")
          text = path.read_text(encoding="utf-8")
          old = '''def replace_once(path: str, old: str, new: str) -> None:\n    p = Path(path)\n'''
          new = '''def replace_once(path: str, old: str, new: str) -> None:\n    if old == new:\n        return\n    p = Path(path)\n'''
          if text.count(old) != 1:
              raise SystemExit("development patcher replace_once anchor changed")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          python tools/apply_core_bsa_measure_history.py
          python tools/fix_core_bsa_measure_history_generated.py

      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: efd54b9a17ce422a2cdbed76d5e7a87671f253c2
          path: _deps/ComfyUI
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r _deps/ComfyUI/requirements.txt
          python -m pip install pytest ruff numpy scipy torchsde psutil safetensors einops tqdm pyyaml pillow packaging transformers tokenizers sentencepiece aiohttp yarl simpleeval blake3 kornia spandrel pydantic pydantic-settings PyOpenGL

      - name: Static validation
        run: |
          python -m ruff check \
            comfyui_spectrum_h3/core_bsa_compat.py \
            comfyui_spectrum_h3/core_bsa_loader_compat.py \
            comfyui_spectrum_h3/core_bsa_flow_compat.py \
            comfyui_spectrum_h3/core_bsa_forecast_recovery.py \
            tests/test_core_bsa_measure_history.py \
            --ignore I001,UP037
          python -m compileall -q comfyui_spectrum_h3 tests/test_core_bsa_measure_history.py

      - name: Targeted contract validation
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_deps/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}
          SPECTRUM_REQUIRE_REVIEWED_BSA_MEASURE_FIXTURE: '1'
        run: |
          python -m pytest -q \
            tests/test_core_bsa_compat.py \
            tests/test_core_bsa_forecast_recovery.py \
            tests/test_core_bsa_flow_compat.py \
            tests/test_core_bsa_preprocess_compat.py \
            tests/test_core_bsa_measure_history.py

      - name: Commit validated production patch
        if: success()
        run: |
          git rm tools/apply_core_bsa_measure_history.py
          git rm tools/fix_core_bsa_measure_history_generated.py
          git rm .github/workflows/weighted-bsa-measure-history-dev.yml
          git rm .github/workflows/weighted-bsa-measure-history-dev2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comfyui_spectrum_h3 .github/workflows/tests.yml tests/test_core_bsa_measure_history.py
          git commit -m "Audit weighted core BSA measure history"
          git push origin HEAD:mirror/mixed-grid-measure-implementation-20260910
