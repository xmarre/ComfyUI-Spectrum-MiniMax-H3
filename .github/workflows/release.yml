name: release

on:
  workflow_run:
    workflows: [tests]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Read package version
        id: version
        shell: bash
        run: |
          version="$(python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid project version: ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

      - name: Validate current release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["VERSION"]
          text = pathlib.Path("RELEASE_NOTES.md").read_text(encoding="utf-8")
          lines = text.splitlines()
          expected = f"# Spectrum MiniMax H3 v{version}"

          if not lines or lines[0].strip() != expected:
              raise SystemExit(
                  f"RELEASE_NOTES.md must start with exactly {expected!r}; "
                  "release notes are for the current release only."
              )

          release_headings = []
          pattern = re.compile(
              r"^#{1,6}\s+.*?\bv([0-9]+\.[0-9]+\.[0-9]+(?:[-.][0-9A-Za-z.-]+)?)\b"
          )
          for line in lines:
              match = pattern.match(line.strip())
              if match:
                  release_headings.append((line.strip(), match.group(1)))

          if release_headings != [(expected, version)]:
              found = ", ".join(repr(heading) for heading, _ in release_headings) or "none"
              raise SystemExit(
                  "RELEASE_NOTES.md must contain exactly one versioned release heading, "
                  f"for v{version}; found: {found}. Do not append past release changelogs."
              )
          PY

      - name: Build release archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p dist
          archive="ComfyUI-Spectrum-MiniMax-H3-v${VERSION}.zip"
          git archive \
            --format=zip \
            --prefix="ComfyUI-Spectrum-MiniMax-H3-v${VERSION}/" \
            --output="dist/${archive}" \
            HEAD
          (cd dist && sha256sum "${archive}" > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --notes-file RELEASE_NOTES.md
            echo "Release ${TAG} already exists; synchronized its notes from RELEASE_NOTES.md."
            exit 0
          fi
          gh release create "${TAG}" \
            dist/ComfyUI-Spectrum-MiniMax-H3-v${VERSION}.zip \
            dist/SHA256SUMS \
            --target "${RELEASE_SHA}" \
            --title "Spectrum MiniMax H3 ${TAG}" \
            --notes-file RELEASE_NOTES.md
