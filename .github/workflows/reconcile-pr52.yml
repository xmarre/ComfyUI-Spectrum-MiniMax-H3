name: reconcile-pr52

on:
  push:
    branches: [pr52-maintainer-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintainer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch contributor test
        run: |
          git fetch --no-tags https://github.com/ukr8b3g-cmyk/ComfyUI-Spectrum-MiniMax-H3.git continuum-interop:refs/remotes/contributor/continuum-interop
          git show refs/remotes/contributor/continuum-interop:tests/test_continuum_interop.py > tests/test_continuum_interop.py

      - name: Reconcile Continuum interop onto current main
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime = "comfyui_spectrum_h3/runtime.py"
          replace_once(
              runtime,
              "    min_actual_steps_after_forecast: int\n    min_tail_actual_steps: int\n    next_step_id: int = 0\n",
              "    min_actual_steps_after_forecast: int\n    min_tail_actual_steps: int\n    min_actual_prefix_steps: int\n    next_step_id: int = 0\n",
          )
          replace_once(
              runtime,
              "        min_actual_steps_after_forecast: int = 0,\n        min_tail_actual_steps: int = 0,\n    ) -> int:\n",
              "        min_actual_steps_after_forecast: int = 0,\n        min_tail_actual_steps: int = 0,\n        min_actual_prefix_steps: int = 0,\n    ) -> int:\n",
          )
          replace_once(
              runtime,
              "        for name, value in (\n            (\"min_actual_steps_after_forecast\", min_actual_steps_after_forecast),\n            (\"min_tail_actual_steps\", min_tail_actual_steps),\n        ):\n",
              "        for name, value in (\n            (\"min_actual_steps_after_forecast\", min_actual_steps_after_forecast),\n            (\"min_tail_actual_steps\", min_tail_actual_steps),\n            (\"min_actual_prefix_steps\", min_actual_prefix_steps),\n        ):\n",
          )
          replace_once(
              runtime,
              "            min_actual_steps_after_forecast=min_actual_steps_after_forecast,\n            min_tail_actual_steps=min_tail_actual_steps,\n        )\n",
              "            min_actual_steps_after_forecast=min_actual_steps_after_forecast,\n            min_tail_actual_steps=min_tail_actual_steps,\n            min_actual_prefix_steps=min(min_actual_prefix_steps, total_steps),\n        )\n",
          )
          replace_once(
              runtime,
              "        elif self._required_feedback_actuals > 0:\n            actual, reason = True, \"anchor residual feedback refresh\"\n            rollback_replay = False\n            consumes_feedback_refresh = True\n        elif step_id < self.config.warmup_steps:\n",
              "        elif self._required_feedback_actuals > 0:\n            actual, reason = True, \"anchor residual feedback refresh\"\n            rollback_replay = False\n            consumes_feedback_refresh = True\n        elif step_id < self._run.min_actual_prefix_steps:\n            actual, reason = True, \"H3 Continuum actual prefix\"\n        elif step_id < self.config.warmup_steps:\n",
          )

          sampling = "comfyui_spectrum_h3/sampling.py"
          replace_once(
              sampling,
              "KJ_PREVIEW_WRAPPER_KEY = \"kj_preview_override\"\n\nSUPPORTED_SINGLE_CALL_SAMPLERS",
              "KJ_PREVIEW_WRAPPER_KEY = \"kj_preview_override\"\nCONTINUUM_REQUEST_KEY = \"h3_continuum\"\n\nSUPPORTED_SINGLE_CALL_SAMPLERS",
          )
          replace_once(
              sampling,
              "@dataclass(slots=True)\nclass SpectrumH3Binding:\n    runtime: SpectrumH3Runtime\n\n\ndef sampler_name",
              "@dataclass(slots=True)\nclass SpectrumH3Binding:\n    runtime: SpectrumH3Runtime\n\n\ndef _continuum_actual_prefix(model_options: dict[str, Any] | None) -> int:\n    transformer_options = (model_options or {}).get(\"transformer_options\")\n    if not isinstance(transformer_options, dict):\n        return 0\n    request = transformer_options.get(CONTINUUM_REQUEST_KEY)\n    if not isinstance(request, dict):\n        return 0\n\n    api = request.get(\"api\")\n    active = request.get(\"active\")\n    prefix = request.get(\"min_actual_prefix_steps\")\n    if type(api) is not int or type(active) is not bool or type(prefix) is not int:\n        return 0\n    if api != 1 or active is not True or prefix < 0:\n        return 0\n    return prefix\n\n\ndef _continuum_prefix_for_phase(prefix: int, phase: str) -> int:\n    return 0 if phase == \"offline_replay\" else prefix\n\n\ndef sampler_name",
          )
          replace_once(
              sampling,
              "    profile_eligible = sampler_is_supported(sampler) and (\n",
              "    continuum_prefix = _continuum_actual_prefix(getattr(guider, \"model_options\", None))\n    continuum_log_emitted = False\n    profile_eligible = sampler_is_supported(sampler) and (\n",
          )
          replace_once(
              sampling,
              "    ):\n        run_id = runtime.start_run(\n            run_sigmas,\n            name,\n            supported_sampler=sampler_is_supported(sampler),\n            max_consecutive_forecasts=max_consecutive_forecasts(sampler),\n            min_actual_steps_after_forecast=min_actual_steps_after_forecast(sampler),\n            min_tail_actual_steps=min_tail_actual_steps(sampler),\n        )\n        if name in ER_SDE_SAMPLERS and (\n",
              "    ):\n        nonlocal continuum_log_emitted\n        phase_prefix = _continuum_prefix_for_phase(continuum_prefix, phase)\n        run_id = runtime.start_run(\n            run_sigmas,\n            name,\n            supported_sampler=sampler_is_supported(sampler),\n            max_consecutive_forecasts=max_consecutive_forecasts(sampler),\n            min_actual_steps_after_forecast=min_actual_steps_after_forecast(sampler),\n            min_tail_actual_steps=min_tail_actual_steps(sampler),\n            min_actual_prefix_steps=phase_prefix,\n        )\n        if phase_prefix > 0 and runtime.supported_sampler and not continuum_log_emitted:\n            LOG.warning(\n                \"Spectrum H3: accepted H3 Continuum API v1, actual prefix=%s\",\n                min(phase_prefix, runtime.stats.total_steps),\n            )\n            continuum_log_emitted = True\n        if name in ER_SDE_SAMPLERS and (\n",
          )

          workflow = ".github/workflows/tests.yml"
          replace_once(
              workflow,
              "            tests/test_config.py \\\n            tests/test_er_sde_solver_dense_output.py \\\n",
              "            tests/test_config.py \\\n            tests/test_continuum_interop.py \\\n            tests/test_er_sde_solver_dense_output.py \\\n",
          )

          test_path = Path("tests/test_continuum_interop.py")
          test_text = test_path.read_text(encoding="utf-8")
          import_anchor = "import torch\n\nfrom comfyui_spectrum_h3.config import SpectrumH3Config\n"
          if import_anchor not in test_text:
              raise SystemExit("tests/test_continuum_interop.py: import anchor not found")
          test_text = test_text.replace(
              import_anchor,
              "import torch\n\nfrom comfyui_spectrum_h3 import external_patch_compat as external_compat\nfrom comfyui_spectrum_h3.config import SpectrumH3Config\n",
              1,
          )
          coexistence = r'''


def _external_contract():
    return {
        "schema_version": 1,
        "provider": "comfyui-diffaid-patches",
        "kind": "text_activation_modulation",
        "architecture": "minimax_h3",
        "instance_id": "diffaid-h3-continuum-test",
        "block_indices_0based": [0],
        "model_block_count": 5,
        "strength": 0.2,
        "sigma_start": 0.55,
        "sigma_end": 1.0,
        "sigma_ramp": 0.0,
        "token_weight_mode": "none",
        "token_tail": 0.35,
        "cond_only": True,
        "scope": "native_mod_segments_tag_1_only",
    }


def _external_runtime_options(sigma):
    return {
        external_compat.EXTERNAL_PATCH_RUNTIME_KEY: (
            {
                "schema_version": 1,
                "provider": "comfyui-diffaid-patches",
                "instance_id": "diffaid-h3-continuum-test",
                "normalized_sigma": sigma,
            },
        )
    }


def _complete_actual_step_with_external(runtime, timestep, normalized_sigma):
    topology = (
        ("video", (1, 24, 2, 4, 4)),
        ("audio", (1, 32, 2, 8)),
        ("hidden", 4),
        ("target_audio_rows", 1),
        ("target_video_rows", 2),
    )
    labels = ((0, "positive"),)
    decision = runtime.begin_step(torch.tensor([timestep]))
    assert decision["actual"]
    assert external_compat.observe_external_patch_runtime(
        runtime,
        _external_runtime_options(normalized_sigma),
    )
    call_id, actual = runtime.begin_model_call(
        decision["run_id"],
        decision["step_id"],
        topology=topology,
        labels=labels,
        expected_shape=(1, 3, 4),
    )
    assert actual
    runtime.observe_actual(
        decision["run_id"],
        decision["step_id"],
        call_id,
        torch.full((1, 3, 4), float(decision["step_id"])),
    )
    runtime.finalize_step(decision["run_id"], decision["step_id"])
    return decision


def test_continuum_prefix_coexists_with_external_patch_transition_without_extra_nfe():
    runtime = _runtime()
    external_compat.configure_runtime_external_patches(
        runtime,
        {external_compat.EXTERNAL_PATCH_CONTRACTS_KEY: [_external_contract()]},
        block_count=5,
    )
    run_id = runtime.start_run(
        torch.tensor([1.0, 0.75, 0.5, 0.25, 0.0]),
        "sample_euler",
        supported_sampler=True,
        max_consecutive_forecasts=1,
        min_actual_prefix_steps=2,
    )
    try:
        first = _complete_actual_step_with_external(runtime, 1.0, 0.70)
        second = _complete_actual_step_with_external(runtime, 0.75, 0.50)
        assert first["reason"] == "H3 Continuum actual prefix"
        assert second["reason"] == "H3 Continuum actual prefix"
        state = external_compat._compat_state(runtime)
        assert state.run is not None
        assert state.run.transitions == 1
        assert state.run.forced_actuals == 0
        assert runtime.stats.actual_transformer_calls == 2
    finally:
        runtime.end_run(run_id)
    assert external_compat._compat_state(runtime).run is None
'''
          if "test_continuum_prefix_coexists_with_external_patch_transition_without_extra_nfe" in test_text:
              raise SystemExit("coexistence test already present unexpectedly")
          test_path.write_text(test_text.rstrip() + coexistence + "\n", encoding="utf-8")
          PY

      - name: Static checks
        run: |
          python -m compileall -q comfyui_spectrum_h3 tests
          python -m pip install -q ruff
          python -m ruff check comfyui_spectrum_h3/runtime.py comfyui_spectrum_h3/sampling.py tests/test_continuum_interop.py --ignore N999,I001,C408,UP035
          git diff --check

      - name: Commit reconciled branch
        run: |
          rm .github/workflows/reconcile-pr52.yml
          git config user.name "xmarre-maintainer"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add comfyui_spectrum_h3/runtime.py comfyui_spectrum_h3/sampling.py tests/test_continuum_interop.py .github/workflows/tests.yml .github/workflows/reconcile-pr52.yml
          git commit -m "Reconcile H3 Continuum interop with v0.2.14" -m "Integrate the contributed H3 Continuum API-v1 actual-prefix receiver onto the current v0.2.14 runtime while preserving ER-SDE solver-state handling, Diff-Aid transition semantics, Python 3.13 CI coverage, and offline-replay safety. Add current-main coexistence coverage for a Diff-Aid hard transition landing inside the Continuum prefix.\n\nCo-authored-by: ukr8b3g-cmyk <236169412+ukr8b3g-cmyk@users.noreply.github.com>"
          git push origin HEAD:pr52-maintainer-reconcile
