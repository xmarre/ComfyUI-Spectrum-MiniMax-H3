name: reconcile-pr52

on:
  push:
    branches: [pr52-maintainer-reconcile]

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out maintainer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch contributor test
        run: |
          git fetch --no-tags https://github.com/ukr8b3g-cmyk/ComfyUI-Spectrum-MiniMax-H3.git continuum-interop:refs/remotes/contributor/continuum-interop
          git show refs/remotes/contributor/continuum-interop:tests/test_continuum_interop.py > tests/test_continuum_interop.py

      - name: Reconcile Continuum interop onto current main
        run: python .github/reconcile_pr52.py

      - name: Static checks
        run: |
          python -m compileall -q comfyui_spectrum_h3 tests
          python -m pip install -q ruff
          python -m ruff check comfyui_spectrum_h3/runtime.py comfyui_spectrum_h3/sampling.py tests/test_continuum_interop.py --ignore N999,I001,C408,UP035
          git diff --check

      - name: Commit reconciled branch
        run: |
          rm .github/workflows/reconcile-pr52.yml .github/reconcile_pr52.py
          git config user.name "xmarre-maintainer"
          git config user.email "54859656+xmarre@users.noreply.github.com"
          git add comfyui_spectrum_h3/runtime.py comfyui_spectrum_h3/sampling.py tests/test_continuum_interop.py .github/workflows/tests.yml .github/workflows/reconcile-pr52.yml .github/reconcile_pr52.py
          git commit -m "Reconcile H3 Continuum interop with v0.2.14" -m "Integrate the contributed H3 Continuum API-v1 actual-prefix receiver onto the current v0.2.14 runtime while preserving ER-SDE solver-state handling, Diff-Aid transition semantics, Python 3.13 CI coverage, and offline-replay safety. Add current-main coexistence coverage for a Diff-Aid hard transition landing inside the Continuum prefix.\n\nCo-authored-by: ukr8b3g-cmyk <236169412+ukr8b3g-cmyk@users.noreply.github.com>"
          git push origin HEAD:pr52-maintainer-reconcile
