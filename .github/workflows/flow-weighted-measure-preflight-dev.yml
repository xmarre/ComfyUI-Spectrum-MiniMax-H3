name: Flow weighted measure preflight development

on:
  push:
    branches:
      - mirror/mixed-grid-measure-implementation-20260910
    paths:
      - tools/apply_flow_weighted_measure_preflight.py
      - .github/workflows/flow-weighted-measure-preflight-dev.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/mixed-grid-measure-implementation-20260910

      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: efd54b9a17ce422a2cdbed76d5e7a87671f253c2
          path: _deps/ComfyUI
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: c86d74bcf139563b14257720259e4788e386aa5c
          path: _deps/FlowRegenerate
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Apply candidate
        run: python tools/apply_flow_weighted_measure_preflight.py

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r _deps/ComfyUI/requirements.txt
          python -m pip install -e '_deps/FlowRegenerate[test]'
          python -m pip install pytest ruff

      - name: Static validation
        run: |
          python -m ruff check \
            comfyui_spectrum_h3/core_bsa_flow_compat.py \
            tests/test_core_bsa_flow_compat.py \
            --ignore I001,UP037,C408,PLR0402
          python -m compileall -q \
            comfyui_spectrum_h3/core_bsa_flow_compat.py \
            tests/test_core_bsa_flow_compat.py

      - name: Targeted cross-repo validation
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_deps/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}/_deps/FlowRegenerate:${{ github.workspace }}
          SPECTRUM_REQUIRE_REVIEWED_BSA_MEASURE_FIXTURE: '1'
        run: |
          python -m pytest -q \
            tests/test_core_bsa_flow_compat.py \
            tests/test_core_bsa_measure_history.py

      - name: Commit validated production candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comfyui_spectrum_h3/core_bsa_flow_compat.py tests/test_core_bsa_flow_compat.py
          git commit -m "Audit Flow weighted measure preflight"
          git push origin HEAD:mirror/mixed-grid-measure-implementation-20260910
