name: Flow weighted measure preflight development

on:
  push:
    branches:
      - mirror/mixed-grid-measure-implementation-20260910
    paths:
      - tools/apply_flow_weighted_measure_preflight.py
      - .github/workflows/flow-weighted-measure-preflight-dev.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mirror/mixed-grid-measure-implementation-20260910

      - uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: efd54b9a17ce422a2cdbed76d5e7a87671f253c2
          path: _deps/ComfyUI
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: c86d74bcf139563b14257720259e4788e386aa5c
          path: _deps/FlowRegenerate
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: xmarre/comfy-kitchen
          ref: d601469afbacc2b10b1327b86fb88f22196d576a
          path: _deps/comfy-kitchen
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Validate weighted sparse provider surface
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          for backend in ("cuda", "hip"):
              path = Path(f"_deps/comfy-kitchen/comfy_kitchen/backends/{backend}/__init__.py")
              tree = ast.parse(path.read_text(encoding="utf-8"))
              functions = [
                  node for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and node.name == "sol_attn_chunked"
              ]
              if len(functions) != 1:
                  raise SystemExit(f"{backend}: expected one sol_attn_chunked definition")
              args = functions[0].args
              names = [arg.arg for arg in (*args.posonlyargs, *args.args, *args.kwonlyargs)]
              if "key_bias" not in names:
                  raise SystemExit(f"{backend}: sol_attn_chunked lacks key_bias")
          PY

      - name: Apply candidate
        run: |
          python tools/apply_flow_weighted_measure_preflight.py
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_core_bsa_flow_compat.py")
          text = path.read_text(encoding="utf-8")
          old = '''def test_weighted_mixed_grid_preflight_synthesizes_block_local_contracts_without_mutation(monkeypatch):\n    _attention, mixed_module = _flow_modules()\n    if not hasattr(mixed_module, "MIXED_GRID_MEASURE_PROFILE_WEIGHTED"):\n        pytest.skip("Flow fixture predates the explicit weighted measure profile")\n\n    model, _patch, _override, options = _installation(sigma=0.5)\n'''
          new = '''def test_weighted_mixed_grid_preflight_synthesizes_block_local_contracts_without_mutation(monkeypatch):\n    _attention, mixed_module = _flow_modules()\n    if not hasattr(mixed_module, "MIXED_GRID_MEASURE_PROFILE_WEIGHTED"):\n        pytest.skip("Flow fixture predates the explicit weighted measure profile")\n\n    model, _patch, _override, options = _installation(sigma=0.5)\n    nodes = _audited_nodes()\n    # Match the production lifecycle: patch/ON_PREPARE_STATE registers the\n    # owner-bound measure capability before Spectrum probes the model call.\n    nodes.install_override(_patch, options)\n\n    # This CPU fixture cannot load the candidate GPU kernel. Expose only the\n    # provider ABI that Spectrum audits; the cross-repo workflow separately\n    # source-checks the pinned CUDA/HIP candidate for this key_bias parameter.\n    def key_bias_capable_chunked(*args, key_bias=None, **kwargs):\n        raise AssertionError("CPU compatibility audit must not execute the sparse kernel")\n\n    monkeypatch.setattr(nodes.ck, "sol_attn_chunked", key_bias_capable_chunked)\n'''
          if text.count(old) != 1:
              raise SystemExit(f"weighted preflight fixture anchor count: {text.count(old)}")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r _deps/ComfyUI/requirements.txt
          python -m pip install -e '_deps/FlowRegenerate[test]'
          python -m pip install pytest ruff

      - name: Static validation
        run: |
          python -m ruff check \
            comfyui_spectrum_h3/core_bsa_flow_compat.py \
            tests/test_core_bsa_flow_compat.py \
            --ignore I001,UP037,C408,PLR0402
          python -m compileall -q \
            comfyui_spectrum_h3/core_bsa_flow_compat.py \
            tests/test_core_bsa_flow_compat.py

      - name: Targeted cross-repo validation
        env:
          COMFYUI_PATH: ${{ github.workspace }}/_deps/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/_deps/ComfyUI:${{ github.workspace }}/_deps/FlowRegenerate:${{ github.workspace }}
          SPECTRUM_REQUIRE_REVIEWED_BSA_MEASURE_FIXTURE: '1'
        run: |
          python -m pytest -q \
            tests/test_core_bsa_flow_compat.py \
            tests/test_core_bsa_measure_history.py

      - name: Commit validated production candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add comfyui_spectrum_h3/core_bsa_flow_compat.py tests/test_core_bsa_flow_compat.py
          git commit -m "Audit Flow weighted measure preflight"
          git push origin HEAD:mirror/mixed-grid-measure-implementation-20260910
