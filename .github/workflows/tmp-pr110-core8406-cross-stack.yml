name: tmp-pr110-core8406-cross-stack

on:
  push:
    branches:
      - mirror/pr110-core8406-compat-20260911

permissions:
  contents: write

jobs:
  targeted-current-cross-stack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Spectrum candidate
        uses: actions/checkout@v4

      - name: Pin the reviewed cache-hardened Core adapter
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("comfyui_spectrum_h3/core_bsa_compat.py")
          text = path.read_text()
          old = "50a8c5a8901b1a43342d5eef0c2fdc256a1b1cbe"
          new = "8c2b181dc663f43dbb09ca8035126a2a99fabfe5"
          assert text.count(old) == 1, "expected exactly one old Core measure-adapter pin"
          assert new not in text, "new Core measure-adapter pin is already present"
          path.write_text(text.replace(old, new))
          PY

      - name: Check out current reviewed Core
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI
          ref: 8406da920f9df19cbc14b76aef1bcd3dc4cf1119
          path: ComfyUI
          persist-credentials: false

      - name: Check out current reviewed Flow
        uses: actions/checkout@v4
        with:
          repository: xmarre/MiniMax-H3-Flow-Aligned-Regenerate
          ref: a6bf395133c8ce496217ca9194f3ab3f2b9181ef
          path: FlowRegenerate
          persist-credentials: false

      - name: Check out current reviewed VDN
        uses: actions/checkout@v4
        with:
          repository: xmarre/ComfyUI-VDN-H3-Plus
          ref: d5f158a1c1750d79b37cb6ef22b0f14e6a8cbad6
          path: VDNH3Plus
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install targeted test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision torchaudio --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            pytest numpy scipy torchsde psutil safetensors einops tqdm pyyaml pillow packaging \
            transformers tokenizers sentencepiece aiohttp yarl alembic SQLAlchemy filelock \
            "av>=17.0.0" requests simpleeval blake3 kornia spandrel pydantic pydantic-settings \
            PyOpenGL comfy-angle "comfy-kitchen==0.2.33" "comfy-aimdo==0.5.3"

      - name: Run current weighted cross-stack tests
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI:${{ github.workspace }}/FlowRegenerate:${{ github.workspace }}/VDNH3Plus:${{ github.workspace }}
          SPECTRUM_REQUIRE_REVIEWED_BSA_MEASURE_FIXTURE: '1'
        run: |
          python -m pytest -q \
            tests/test_core_bsa_measure_history.py \
            tests/test_core_bsa_measure_receipt_identity.py \
            tests/test_core_bsa_vdn_measure_compat.py \
            tests/test_core_bsa_flow_compat.py

      - name: Commit validated source pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add comfyui_spectrum_h3/core_bsa_compat.py
          git diff --cached --quiet && { echo "validated pin produced no diff"; exit 1; }
          git commit -m "Pin hardened Core weighted BSA adapter"
          git push origin HEAD:mirror/pr110-core8406-compat-20260911
