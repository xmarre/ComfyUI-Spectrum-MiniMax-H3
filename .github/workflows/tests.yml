name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-native-fixture:
    strategy:
      fail-fast: false
      matrix:
        comfy_ref:
          - e377e263049f9338b4d12a3dd417b36ae62948ff
          - 0dd9b154a1654fc699dcdc3af066c7cce096045a
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out reviewed ComfyUI source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: comfyanonymous/ComfyUI
          ref: ${{ matrix.comfy_ref }}
          path: ComfyUI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest numpy psutil safetensors einops tqdm pyyaml pillow packaging comfy-kitchen==0.2.26 comfy-aimdo==0.4.13
          python -m pip wheel --no-deps --wheel-dir /tmp/spectrum-h3-wheel .

      - name: Run forecaster smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/smoke_forecaster.py

      - name: Run tests against native MiniMax H3
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: python -m pytest -q
