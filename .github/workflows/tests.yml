name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-and-native-fixture:
    strategy:
      fail-fast: false
      matrix:
        comfy_ref:
          - e377e263049f9338b4d12a3dd417b36ae62948ff
          - 0dd9b154a1654fc699dcdc3af066c7cce096045a
          - 5599a05fea715cb2aff11f30f5b06e16d0dfa0c4
          - 27bca654eb9a70237d93f56a6ea336ab55f8925d
    runs-on: ubuntu-latest
    steps:
      - name: Check out custom node
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check out reviewed ComfyUI source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          repository: comfyanonymous/ComfyUI
          ref: ${{ matrix.comfy_ref }}
          path: ComfyUI

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install pytest ruff numpy psutil safetensors einops tqdm pyyaml pillow packaging comfy-kitchen==0.2.26 comfy-aimdo==0.4.13
          python -m pip wheel --no-deps --wheel-dir /tmp/spectrum-h3-wheel .

      - name: Run forecaster smoke test
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python tests/smoke_forecaster.py

      - name: Run Ruff and compileall
        run: |
          python -m ruff check \
            comfyui_spectrum_h3/external_patch_compat.py \
            comfyui_spectrum_h3/external_patch_hardening.py \
            tests/test_external_patch_compat.py \
            tests/test_external_patch_hardening.py \
            --ignore I001,UP037
          python -m ruff check \
            comfyui_spectrum_h3/config.py \
            comfyui_spectrum_h3/generic_correction.py \
            comfyui_spectrum_h3/generic_correction_calibration.py \
            comfyui_spectrum_h3/generic_correction_controller.py \
            comfyui_spectrum_h3/generic_correction_core.py \
            comfyui_spectrum_h3/generic_correction_evaluator.py \
            comfyui_spectrum_h3/generic_correction_research.py \
            comfyui_spectrum_h3/generic_correction_runtime.py \
            comfyui_spectrum_h3/generic_correction_topology.py \
            comfyui_spectrum_h3/experiments.py \
            comfyui_spectrum_h3/er_sde_ksampler_contract.py \
            comfyui_spectrum_h3/er_sde_stochastic.py \
            comfyui_spectrum_h3/objective_media.py \
            comfyui_spectrum_h3/objective_media_bounded.py \
            comfyui_spectrum_h3/objective_media_nodes.py \
            comfyui_spectrum_h3/nodes.py \
            comfyui_spectrum_h3/postrun_safety.py \
            comfyui_spectrum_h3/runtime.py \
            comfyui_spectrum_h3/sampling.py \
            comfyui_spectrum_h3/__init__.py \
            tests/test_config.py \
            tests/test_er_sde_solver_dense_output.py \
            tests/test_er_sde_stochastic_compensation.py \
            tests/test_generic_correction.py \
            tests/test_generic_correction_calibration.py \
            tests/test_generic_correction_core.py \
            tests/test_generic_correction_evaluator.py \
            tests/test_generic_correction_research.py \
            tests/test_generic_correction_research_regional_summary.py \
            tests/test_model_aware.py \
            tests/test_objective_media.py \
            tests/test_objective_media_bounded.py \
            tests/test_objective_media_seed_link.py \
            tests/test_objective_media_sequential.py \
            tests/test_postrun_safety.py \
            tests/test_runtime.py \
            tests/test_sampler_contract.py \
            tests/test_sampling.py \
            tests/test_tiled_diffusion_ksampler_contract.py \
            tests/conftest.py \
            tools/analyze_generic_correction.py \
            --ignore N999,I001,C408,UP035
          python -m compileall -q comfyui_spectrum_h3 tests tools

      - name: Run focused external compatibility suites
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: |
          python -m pytest -q \
            tests/test_external_patch_compat.py \
            tests/test_external_patch_hardening.py \
            tests/test_h3_wrapper.py \
            tests/test_runtime.py \
            tests/test_sampling.py \
            tests/test_model_aware.py \
            tests/test_native_equivalence.py \
            tests/test_er_sde_stochastic_compensation.py

      - name: Run tests against native MiniMax H3
        env:
          COMFYUI_PATH: ${{ github.workspace }}/ComfyUI
          PYTHONPATH: ${{ github.workspace }}/ComfyUI
        run: |
          python -m pytest -q \
            --ignore=tests/test_external_patch_compat.py \
            --ignore=tests/test_external_patch_hardening.py \
            --ignore=tests/test_h3_wrapper.py \
            --ignore=tests/test_runtime.py \
            --ignore=tests/test_sampling.py \
            --ignore=tests/test_model_aware.py \
            --ignore=tests/test_native_equivalence.py \
            --ignore=tests/test_er_sde_stochastic_compensation.py
